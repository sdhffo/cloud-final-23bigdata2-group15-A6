# Docker 管理脚本配置文件
# 使用方式：脚本通过 --env 参数指定环境（dev/prod），未指定则用 default

[default]
IMAGE_NAME = python-demo
TAG = latest
CONTAINER_NAME = python-app
PORT_MAP = 8080:5000
APP_DIR = ./
HOST_LOG_DIR = $HOME/docker-demo/host-logs
CONTAINER_LOG_DIR = /app/logs
ENV_VARS = -e APP_NAME='MyAwesomeApp' -e PORT=5000
# 远程仓库地址（推送镜像用，本地推送可留空或填 localhost:5000）
REMOTE_REGISTRY = localhost:5000

[dev]
IMAGE_NAME = python-demo-dev
TAG = dev-latest
CONTAINER_NAME = python-app-dev
PORT_MAP = 8081:5000
HOST_LOG_DIR = $HOME/docker-demo/dev-logs
REMOTE_REGISTRY = localhost:5000

[prod]
IMAGE_NAME = python-demo-prod
TAG = prod-v1.0
CONTAINER_NAME = python-app-prod
PORT_MAP = 80:5000
HOST_LOG_DIR = $HOME/docker-demo/prod-logs
ENV_VARS = -e APP_NAME='MyAwesomeApp-Prod' -e PORT=5000
REMOTE_REGISTRY = localhost:5000